<svg xmlns="http://www.w3.org/2000/svg" width="900" height="270" viewBox="0 0 900 270" role="img" aria-label="Hi, I&#x27;m Jihoo">
  <title>Hi, I&#x27;m Jihoo</title>
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14121f"/><stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="art" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7f5af0"/><stop offset=".55" stop-color="#3da9fc"/><stop offset="1" stop-color="#2cb67d"/>
    </linearGradient>
    <linearGradient id="barG" gradientUnits="userSpaceOnUse" x1="336" y1="0" x2="868.5999999999999" y2="0">
      <stop offset="0" stop-color="#7f5af0"/><stop offset=".5" stop-color="#3da9fc"/><stop offset="1" stop-color="#2cb67d"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".35"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="reflect"><rect x="336" y="196" width="532.5999999999999" height="30" fill="url(#fade)"/></mask>
    <radialGradient id="label"><stop offset="0" stop-color="#fff"/><stop offset=".25" stop-color="#2cb67d"/><stop offset="1" stop-color="#7f5af0"/></radialGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".18"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="38"/></filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="6" dy="8" stdDeviation="8" flood-opacity=".55"/></filter>
    <clipPath id="artClip"><rect x="36" y="40" width="190" height="190" rx="10"/></clipPath>
    <clipPath id="frame"><rect width="900" height="270" rx="18"/></clipPath>
  </defs>
  <style>
    .b     { fill: url(#barG); transform-box: fill-box; transform-origin: bottom;
             animation-timing-function: ease-in-out; animation-iteration-count: infinite; animation-direction: alternate; }
    @keyframes eq0 { 0% { transform: scaleY(0.25); } 25% { transform: scaleY(1); } 50% { transform: scaleY(0.45); } 75% { transform: scaleY(0.8); } 100% { transform: scaleY(0.3); } }
    @keyframes eq1 { 0% { transform: scaleY(0.6); } 25% { transform: scaleY(0.2); } 50% { transform: scaleY(0.9); } 75% { transform: scaleY(0.4); } 100% { transform: scaleY(1); } }
    @keyframes eq2 { 0% { transform: scaleY(0.4); } 25% { transform: scaleY(0.75); } 50% { transform: scaleY(0.3); } 75% { transform: scaleY(1); } 100% { transform: scaleY(0.5); } }
    @keyframes eq3 { 0% { transform: scaleY(1); } 25% { transform: scaleY(0.5); } 50% { transform: scaleY(0.7); } 75% { transform: scaleY(0.2); } 100% { transform: scaleY(0.85); } }
    @keyframes eq4 { 0% { transform: scaleY(0.3); } 25% { transform: scaleY(0.9); } 50% { transform: scaleY(0.6); } 75% { transform: scaleY(0.35); } 100% { transform: scaleY(0.7); } }
    .eq0 { animation-name: eq0; } .eq1 { animation-name: eq1; } .eq2 { animation-name: eq2; } .eq3 { animation-name: eq3; } .eq4 { animation-name: eq4; }
    .vinyl { transform-origin: 232px 135.0px; animation: spin 2.4s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .grooves circle { fill: none; stroke: #2a2a33; stroke-width: 1; }
    .aura  { transform-origin: 131.0px 135.0px; animation: aura .9s ease-in-out infinite alternate; }
    @keyframes aura { from { transform: scale(.85); opacity: .45; } to { transform: scale(1.1); opacity: .8; } }
    .np    { font: 700 11px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill: #2cb67d; letter-spacing: 3px; }
    .title { font: 800 32.0px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill: #fff; }
    .artist { font: 500 15px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill: #b8b5c9; }
    .chip  { fill: #fff; fill-opacity: .07; stroke: #fff; stroke-opacity: .15; }
    .chipt { font: 600 11px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill: #d9d6e8; }
    .mini  { fill: #2cb67d; transform-box: fill-box; transform-origin: bottom; animation: eq1 .8s ease-in-out infinite alternate; }
    .tm    { font: 600 13px ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace; fill: #9d9ab0; }
    .dm    { animation: dm 240s steps(4) infinite; }
    .dt    { animation: dt 60s steps(6) infinite; }
    .do    { animation: do 10s steps(10) infinite; }
    @keyframes dm { to { transform: translateY(-64px); } }
    @keyframes dt { to { transform: translateY(-96px); } }
    @keyframes do { to { transform: translateY(-160px); } }
    .prog  { fill: url(#barG); transform-box: fill-box; transform-origin: left; animation: prog 240s linear infinite; }
    @keyframes prog { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    .knob  { fill: #fff; animation: knob 240s linear infinite; }
    @keyframes knob { to { transform: translateX(532.5999999999999px); } }
    .ctl   { fill: #e8e6f3; }
    .art   { animation: hue 12s ease-in-out infinite alternate; }
    @keyframes hue { to { transform: translate(-40px, -30px) rotate(25deg); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; }  }
  </style>
