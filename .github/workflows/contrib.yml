name: Update contribution SVGs

on:
  schedule:
    - cron: "0 0 * * *"   # daily at 00:00 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["generate.py", "contrib.py", "flake.nix", "flake.lock"]

permissions:
  contents: write

concurrency:
  group: contrib-svg
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Generate SVGs
        run: |
          nix run . -- --style contrib-grid --user "${{ github.repository_owner }}"
          nix run . -- --style contrib-city --user "${{ github.repository_owner }}"
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/contrib-*.svg
          git diff --cached --quiet || git commit -m "chore: update contribution SVGs"
          git push
