<svg xmlns="http://www.w3.org/2000/svg" width="900" height="290" viewBox="0 0 900 290" role="img" aria-label="Hi, I&#x27;m Jihoo">
  <title>Hi, I&#x27;m Jihoo</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f6fd6"/><stop offset=".6" stop-color="#62bdf6"/><stop offset="1" stop-color="#dff5ff"/>
    </linearGradient>
    <radialGradient id="puff" cx="40%" cy="30%" r="75%">
      <stop offset="0" stop-color="#fff"/><stop offset=".6" stop-color="#f7fbff"/><stop offset="1" stop-color="#bcd4ef"/>
    </radialGradient>
    <linearGradient id="cloudBase" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dff5ff" stop-opacity="0"/><stop offset=".3" stop-color="#dff5ff"/><stop offset="1" stop-color="#dff5ff"/>
    </linearGradient>
    <radialGradient id="sun">
      <stop offset="0" stop-color="#fff"/><stop offset=".18" stop-color="#fffbe8"/><stop offset=".45" stop-color="#fff3c4" stop-opacity=".45"/>
      <stop offset="1" stop-color="#fff3c4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rayFade">
      <stop offset="0" stop-color="#fff" stop-opacity=".5"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="leak" cx="85%" cy="5%" r="70%">
      <stop offset="0" stop-color="#fff6d8" stop-opacity=".55"/><stop offset="1" stop-color="#fff6d8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="mesh" width="14" height="14" patternUnits="userSpaceOnUse">
      <path d="M0 7 L7 0 L14 7 L7 14Z" fill="none" stroke="#2e4664" stroke-width="1.3" opacity=".75"/>
    </pattern>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fa3b8"/><stop offset="1" stop-color="#5c7189"/>
    </linearGradient>
    <clipPath id="frame"><rect width="900" height="290" rx="16"/></clipPath>
  </defs>
  <style>
    .rays   { transform-origin: 750px 46px; animation: spin 60s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .flare  { opacity: .22; animation: flare 3s ease-in-out infinite alternate; }
    @keyframes flare { to { opacity: .06; } }
    .drift  { animation: drift ease-in-out infinite alternate; }
    @keyframes drift { from { transform: translateX(-14px); } to { transform: translateX(16px); } }
    .pass   { animation: pass linear infinite; }
    @keyframes pass { from { transform: translateX(80px); } to { transform: translateX(-1160px); } }
    .trail  { fill: none; stroke: #fff; stroke-linecap: round; stroke-dasharray: 100 100; animation: trail 16.0s linear infinite; }
    @keyframes trail { 0% { stroke-dashoffset: 100; opacity: .95; stroke-width: 2; } 45% { stroke-dashoffset: 0; opacity: .9; stroke-width: 2.6; }
                       90% { opacity: 0; stroke-width: 9; stroke-dashoffset: 0; } 100% { opacity: 0; stroke-dashoffset: 0; } }
    .ptrail { fill: none; stroke: #fff; stroke-width: 1.6; stroke-dasharray: 100 100; animation: ptrail 11.0s linear infinite; }
    @keyframes ptrail { 0% { stroke-dashoffset: 100; opacity: .7; } 55% { stroke-dashoffset: 0; opacity: .6; }
                        80%, 100% { stroke-dashoffset: 0; opacity: 0; } }
    .spark  { fill: #fff; transform-box: fill-box; transform-origin: center; animation: spark ease-in-out infinite; }
    @keyframes spark { 0%, 100% { opacity: 0; scale: .3; } 50% { opacity: .95; scale: 1; } }
    .wind   { fill: none; stroke: #fff; stroke-width: 1.6; stroke-linecap: round; stroke-dasharray: 40 200; animation: wind linear infinite; }
    @keyframes wind { from { stroke-dashoffset: 40; opacity: .8; } to { stroke-dashoffset: -170; opacity: 0; } }
    .name   { font: italic 900 56.0px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; letter-spacing: 1px; paint-order: stroke; stroke-linejoin: round;
              transform-box: fill-box; transform-origin: center; animation: pop 1.1s cubic-bezier(.2, 1.6, .4, 1) both; }
    .front  { fill: #fff; stroke: #1b57b0; stroke-width: 7; }
    .shadow { fill: #ff7eb3; stroke: #ff7eb3; stroke-width: 7; animation-delay: .08s; }
    @keyframes pop { from { opacity: 0; transform: scale(.4) rotate(-6deg); } }
    .ribbon { animation: slide .8s .7s cubic-bezier(.2, 1.3, .4, 1) both; }
    @keyframes slide { from { opacity: 0; transform: translateX(-40px); } }
    .sub    { font: 700 15px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill: #1b57b0; letter-spacing: 1.5px; }
    .badge  { font: 800 15px 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif; fill: #fff; }
    .bob    { animation: bob 3s ease-in-out infinite alternate; }
    @keyframes bob { to { transform: translateY(-5px); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .trail, .ptrail { opacity: 0; } }
  </style>
  <g clip-path="url(#frame)">
    <rect width="900" height="290" fill="url(#sky)"/>
    <g class="rays" fill="url(#rayFade)" opacity=".5"><g transform="translate(750 46)"><path d="M0 0 L419 -21 L419 21Z"/><path d="M0 0 L387 163 L369 201Z"/><path d="M0 0 L278 315 L245 341Z"/><path d="M0 0 L114 404 L73 414Z"/><path d="M0 0 L-73 414 L-114 404Z"/><path d="M0 0 L-245 341 L-278 315Z"/><path d="M0 0 L-369 201 L-387 163Z"/><path d="M0 0 L-419 21 L-419 -21Z"/><path d="M0 0 L-387 -163 L-369 -201Z"/><path d="M0 0 L-278 -315 L-245 -341Z"/><path d="M0 0 L-114 -404 L-73 -414Z"/><path d="M0 0 L73 -414 L114 -404Z"/><path d="M0 0 L245 -341 L278 -315Z"/><path d="M0 0 L369 -201 L387 -163Z"/></g></g>
    <circle cx="750" cy="46" r="120" fill="url(#sun)"/>
    <g class="pass" style="animation-duration:56s;animation-delay:-52s"><g fill="url(#puff)"><circle cx="937" cy="89" r="35"/><circle cx="965" cy="90" r="33"/><circle cx="957" cy="92" r="30"/><circle cx="991" cy="92" r="30"/><circle cx="907" cy="93" r="28"/><circle cx="910" cy="96" r="24"/><circle cx="1005" cy="96" r="23"/></g></g><g class="pass" style="animation-duration:70s;animation-delay:-36s"><g fill="url(#puff)"><circle cx="939" cy="35" r="24"/><circle cx="911" cy="37" r="21"/><circle cx="976" cy="38" r="20"/><circle cx="920" cy="38" r="20"/><circle cx="906" cy="39" r="18"/><circle cx="949" cy="40" r="17"/><circle cx="916" cy="41" r="14"/></g></g><g class="pass" style="animation-duration:70s;animation-delay:-33s"><g fill="url(#puff)"><circle cx="928" cy="80" r="30"/><circle cx="1002" cy="83" r="26"/><circle cx="950" cy="83" r="26"/><circle cx="1010" cy="84" r="25"/><circle cx="995" cy="84" r="23"/><circle cx="911" cy="86" r="21"/><circle cx="995" cy="87" r="19"/></g></g><g class="pass" style="animation-duration:72s;animation-delay:-15s"><g fill="url(#puff)"><circle cx="933" cy="55" r="17"/><circle cx="943" cy="59" r="18"/><circle cx="904" cy="63" r="15"/><circle cx="973" cy="64" r="14"/><circle cx="911" cy="64" r="13"/><circle cx="963" cy="65" r="12"/><circle cx="972" cy="65" r="12"/></g></g>
    <path d="M-20 150 C270 120 495 70 930 34" pathLength="100" class="trail"/>
    <g><animateMotion dur="16.0s" repeatCount="indefinite" path="M-20 150 C270 120 495 70 930 34" rotate="auto"
        keyPoints="0;1;1" keyTimes="0;.45;1" calcMode="linear"/>
      <animate attributeName="opacity" dur="16.0s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;.45" values="1;0"/>
      <path d="M4 0 L-6 -1.4 L-9 -6 L-11 -6 L-9 -1.3 L-14 -1 L-15 -3 L-16.5 -3 L-16 0 L-16.5 3 L-15 3 L-14 1 L-9 1.3 L-11 6 L-9 6 L-6 1.4Z" fill="#fff"/>
    </g>
    <g class="drift" style="animation-duration:34s"><g fill="url(#puff)"><circle cx="127" cy="123" r="44"/><circle cx="157" cy="148" r="58"/><circle cx="147" cy="155" r="46"/><circle cx="147" cy="157" r="37"/><circle cx="55" cy="159" r="40"/><circle cx="184" cy="165" r="33"/><circle cx="167" cy="168" r="39"/><circle cx="134" cy="169" r="58"/><circle cx="149" cy="171" r="53"/><circle cx="58" cy="171" r="52"/><circle cx="188" cy="174" r="48"/><circle cx="160" cy="176" r="44"/><circle cx="60" cy="179" r="36"/><circle cx="184" cy="182" r="51"/><circle cx="59" cy="189" r="41"/><circle cx="202" cy="195" r="33"/><circle cx="31" cy="195" r="51"/><circle cx="223" cy="200" r="44"/><circle cx="219" cy="203" r="38"/><circle cx="216" cy="203" r="38"/><circle cx="16" cy="205" r="35"/><circle cx="16" cy="206" r="34"/></g><rect x="-1" y="222" width="237" height="30" fill="url(#cloudBase)"/></g><g class="drift" style="animation-duration:41s;animation-direction:alternate-reverse"><g fill="url(#puff)"><circle cx="726" cy="149" r="48"/><circle cx="739" cy="155" r="74"/><circle cx="757" cy="167" r="43"/><circle cx="731" cy="171" r="44"/><circle cx="694" cy="173" r="44"/><circle cx="784" cy="177" r="44"/><circle cx="752" cy="180" r="46"/><circle cx="693" cy="180" r="55"/><circle cx="725" cy="182" r="70"/><circle cx="694" cy="187" r="45"/><circle cx="813" cy="187" r="53"/><circle cx="783" cy="190" r="59"/><circle cx="849" cy="191" r="58"/><circle cx="794" cy="193" r="56"/><circle cx="693" cy="194" r="53"/><circle cx="656" cy="195" r="52"/><circle cx="685" cy="196" r="38"/><circle cx="837" cy="198" r="36"/><circle cx="869" cy="198" r="46"/><circle cx="840" cy="200" r="44"/></g><rect x="618" y="222" width="264" height="30" fill="url(#cloudBase)"/></g>
    <path d="M0 0 q40 -10 80 0 t80 0" class="wind" transform="translate(623 140)" style="animation-duration:6.5s;animation-delay:-3.5s"/><path d="M0 0 q40 -10 80 0 t80 0" class="wind" transform="translate(18 79)" style="animation-duration:4.9s;animation-delay:-5.4s"/><path d="M0 0 q40 -10 80 0 t80 0" class="wind" transform="translate(537 186)" style="animation-duration:6.7s;animation-delay:-1.3s"/><path d="M0 0 q40 -10 80 0 t80 0" class="wind" transform="translate(100 75)" style="animation-duration:6.3s;animation-delay:-5.3s"/><path d="M0 0 q40 -10 80 0 t80 0" class="wind" transform="translate(225 151)" style="animation-duration:4.5s;animation-delay:-5.6s"/>
    <path d="M0 -7 L1.6 -1.6 L7 0 L1.6 1.6 L0 7 L-1.6 1.6 L-7 0 L-1.6 -1.6Z" class="spark" transform="translate(106 53) scale(0.86)" style="animation-duration:3.4s;animation-delay:-0.9s"/><path d="M0 -7 L1.6 -1.6 L7 0 L1.6 1.6 L0 7 L-1.6 1.6 L-7 0 L-1.6 -1.6Z" class="spark" transform="translate(138 177) scale(0.65)" style="animation-duration:3.2s;animation-delay:-2.5s"/><path d="M0 -7 L1.6 -1.6 L7 0 L1.6 1.6 L0 7 L-1.6 1.6 L-7 0 L-1.6 -1.6Z" class="spark" transform="translate(384 123) scale(0.81)" style="animation-duration:3.9s;animation-delay:-0.8s"/><path d="M0 -7 L1.6 -1.6 L7 0 L1.6 1.6 L0 7 L-1.6 1.6 L-7 0 L-1.6 -1.6Z" class="spark" transform="translate(627 62) scale(0.74)" style="animation-duration:3.3s;animation-delay:-1.2s"/><path d="M0 -7 L1.6 -1.6 L7 0 L1.6 1.6 L0 7 L-1.6 1.6 L-7 0 L-1.6 -1.6Z" class="spark" transform="translate(299 152) scale(0.54)" style="animation-duration:2.9s;animation-delay:-4.0s"/><path d="M0 -7 L1.6 -1.6 L7 0 L1.6 1.6 L0 7 L-1.6 1.6 L-7 0 L-1.6 -1.6Z" class="spark" transform="translate(857 33) scale(0.63)" style="animation-duration:2.5s;animation-delay:-3.7s"/><path d="M0 -7 L1.6 -1.6 L7 0 L1.6 1.6 L0 7 L-1.6 1.6 L-7 0 L-1.6 -1.6Z" class="spark" transform="translate(762 175) scale(0.72)" style="animation-duration:2.3s;animation-delay:-3.3s"/><path d="M0 -7 L1.6 -1.6 L7 0 L1.6 1.6 L0 7 L-1.6 1.6 L-7 0 L-1.6 -1.6Z" class="spark" transform="translate(617 128) scale(1.09)" style="animation-duration:3.3s;animation-delay:-0.0s"/><path d="M0 -7 L1.6 -1.6 L7 0 L1.6 1.6 L0 7 L-1.6 1.6 L-7 0 L-1.6 -1.6Z" class="spark" transform="translate(710 73) scale(0.90)" style="animation-duration:3.9s;animation-delay:-0.5s"/><path d="M0 -7 L1.6 -1.6 L7 0 L1.6 1.6 L0 7 L-1.6 1.6 L-7 0 L-1.6 -1.6Z" class="spark" transform="translate(135 39) scale(0.83)" style="animation-duration:2.5s;animation-delay:-2.4s"/><path d="M0 -7 L1.6 -1.6 L7 0 L1.6 1.6 L0 7 L-1.6 1.6 L-7 0 L-1.6 -1.6Z" class="spark" transform="translate(628 56) scale(0.88)" style="animation-duration:2.5s;animation-delay:-2.0s"/><path d="M0 -7 L1.6 -1.6 L7 0 L1.6 1.6 L0 7 L-1.6 1.6 L-7 0 L-1.6 -1.6Z" class="spark" transform="translate(782 169) scale(0.56)" style="animation-duration:2.8s;animation-delay:-1.1s"/><path d="M0 -7 L1.6 -1.6 L7 0 L1.6 1.6 L0 7 L-1.6 1.6 L-7 0 L-1.6 -1.6Z" class="spark" transform="translate(43 156) scale(0.88)" style="animation-duration:2.5s;animation-delay:-3.0s"/><path d="M0 -7 L1.6 -1.6 L7 0 L1.6 1.6 L0 7 L-1.6 1.6 L-7 0 L-1.6 -1.6Z" class="spark" transform="translate(492 95) scale(0.51)" style="animation-duration:2.2s;animation-delay:-3.5s"/>
    <circle cx="628" cy="82" r="10" class="flare" style="animation-delay:-0.8s" fill="#fff"/><circle cx="530" cy="111" r="22" class="flare" style="animation-delay:-1.4s" fill="#ff7eb3"/><circle cx="446" cy="135" r="7" class="flare" style="animation-delay:-1.9s" fill="#fff"/><circle cx="358" cy="161" r="34" class="flare" style="animation-delay:-2.4s" fill="#bfe6ff"/><circle cx="260" cy="190" r="14" class="flare" style="animation-delay:-3.0s" fill="#ff7eb3"/>
    <rect width="900" height="290" fill="url(#leak)" class="flare" style="animation-duration:5s"/>

    <path d="M-30 220 C150 210 300 190 380 150 C440 120 470 66 430 56 C390 46 372 96 412 116 C480 150 650 128 940 70" pathLength="100" class="ptrail"/>
    <g><animateMotion dur="11.0s" repeatCount="indefinite" path="M-30 220 C150 210 300 190 380 150 C440 120 470 66 430 56 C390 46 372 96 412 116 C480 150 650 128 940 70" rotate="auto"
        keyPoints="0;1;1" keyTimes="0;.55;1" calcMode="spline" keySplines=".3 0 .7 1;0 0 1 1"/>
      <path d="M10 0 L-14 -9 L-8 0Z" fill="#fff"/><path d="M10 0 L-14 9 L-8 0Z" fill="#dbe7f5"/>
      <path d="M10 0 L-8 0 L-11 3Z" fill="#b9cbe3"/>
    </g>

    <g>
      <g class="bob"><circle cx="208" cy="110" r="25" fill="#ff7eb3"/>
        <text x="208" y="107" text-anchor="middle" class="badge">青</text>
        <text x="208" y="123" text-anchor="middle" class="badge">春</text></g>
      <text x="464.0" y="134" text-anchor="middle" class="name shadow">Hi, I&#x27;m Jihoo</text>
      <text x="460.0" y="130" text-anchor="middle" class="name front">Hi, I&#x27;m Jihoo</text>
      <g class="ribbon">
        <rect x="357" y="148" width="206" height="28" rx="14" fill="#fff" opacity=".92"/>
        <text x="460.0" y="167" text-anchor="middle" class="sub">Welcome to my GitHub!</text>
      </g>
    </g>

    <rect y="226" width="900" height="64" fill="url(#mesh)"/>
    <rect y="220" width="900" height="5" rx="2" fill="#2e4664"/>
    <g fill="#2e4664"><rect x="18" y="220" width="6" height="70" rx="2"/><rect x="146" y="220" width="6" height="70" rx="2"/><rect x="274" y="220" width="6" height="70" rx="2"/><rect x="402" y="220" width="6" height="70" rx="2"/><rect x="530" y="220" width="6" height="70" rx="2"/><rect x="658" y="220" width="6" height="70" rx="2"/><rect x="786" y="220" width="6" height="70" rx="2"/></g>
    <rect y="276" width="900" height="14" fill="url(#floor)"/>
    <rect y="276" width="900" height="2" fill="#fff" opacity=".4"/>
  </g>
</svg>
