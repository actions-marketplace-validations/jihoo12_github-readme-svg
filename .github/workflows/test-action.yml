name: Test Marketplace action
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Run local action
        id: svg
        uses: ./
        with:
          style: synthwave
          name: Marketplace smoke test
          output-dir: generated
      - name: Check action output and run integration tests
        shell: bash
        env:
          SVG_FILES: ${{ steps.svg.outputs.files }}
        run: |
          python -c 'import json, os, pathlib; files = json.loads(os.environ["SVG_FILES"]); assert len(files) == 1; assert pathlib.Path(files[0]).is_file()'
          python -m unittest discover -s tests -v
